openapi: 3.0.0
info:
  title: SolarStream IoT API
  description: Real-time telemetry API for the portable solar power station project.
  version: 1.1.0

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/v1/telemetry:
    get:
      summary: Get Latest Solar Telemetry
      description: Retrieves the most recent 5-channel telemetry readings from Firebase.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  solarAmps:
                    type: number
                    format: float
                    example: 1.2
                  chargeAmps:
                    type: number
                    format: float
                    example: 1.0
                  loadAmps:
                    type: number
                    format: float
                    example: 0.5
                  batteryPercent:
                    type: integer
                    example: 85
                  busVoltage:
                    type: number
                    format: float
                    example: 4.02
                  timestamp:
                    type: integer
                    description: Epoch timestamp generated by Firebase
                    example: 1716000000000
    post:
      summary: Upload Solar Telemetry
      description: Receives the 5-channel telemetry data from the ESP32 (or Simulator) and syncs it to Firebase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - solarAmps
                - chargeAmps
                - loadAmps
                - batteryPercent
                - busVoltage
              properties:
                solarAmps:
                  type: number
                  format: float
                  example: 1.2
                chargeAmps:
                  type: number
                  format: float
                  example: 1.0
                loadAmps:
                  type: number
                  format: float
                  example: 0.5
                batteryPercent:
                  type: integer
                  example: 85
                busVoltage:
                  type: number
                  format: float
                  example: 4.02
      responses:
        '200':
          description: Data successfully synced to Firebase
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Telemetry recorded"
        '400':
          description: Invalid request - missing required fields
        '500':
          description: Internal server error - Firebase sync failed

  /api/v1/auth/login:
    post:
      summary: User Login/Registration
      description: Authenticates a user or registers them if they don't exist, returning a session prefix for chat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: "maker@solarstream.com"
                password:
                  type: string
                  example: "securepassword123"
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  userPrefix:
                    type: string
                  status:
                    type: string

  /api/v1/chat:
    get:
      summary: Get Recent Chat Messages
      description: Retrieves the last 50 messages from the community chat.
      responses:
        '200':
          description: OK
    post:
      summary: Post a Chat Message
      description: Pushes a new message to the Realtime Database via the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userPrefix
                - text
              properties:
                userPrefix:
                  type: string
                  example: "Maker"
                text:
                  type: string
                  example: "Testing the CN3791 controller today."
      responses:
        '201':
          description: Message created successfully